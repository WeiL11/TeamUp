name: Test Nashville Page Access

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test HTML page access
        run: |
          echo "=== Testing HTML page ==="
          curl -s -o /tmp/page.html -w "HTTP Status: %{http_code}\nSize: %{size_download} bytes\n" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36" \
            "https://www.nashville.gov/departments/parks/community-centers-and-recreation"

          echo ""
          echo "=== PDF links found on page ==="
          grep -o 'href="[^"]*\.pdf[^"]*"' /tmp/page.html | head -30 || echo "No PDF links found"

          echo ""
          echo "=== Page snippet (first 500 chars) ==="
          head -c 500 /tmp/page.html
