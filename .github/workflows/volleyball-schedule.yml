name: Nashville Volleyball Schedule

on:
  schedule:
    - cron: '0 14 1 * *'  # 每月1日 UTC 14:00 (Nashville 早上8點)
  workflow_dispatch:

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pdfplumber beautifulsoup4

      - name: Run scraper
        run: python scripts/volleyball_schedule.py

      - name: Commit updated schedule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add volleyball-schedule.md
          git diff --staged --quiet || git commit -m "chore: update volleyball schedule $(date '+%Y-%m-%d')"
          git push
