name: Test Nashville PDF Download

on:
  workflow_dispatch:

jobs:
  test-download:
    runs-on: ubuntu-latest
    steps:
      - name: Try to download a Nashville PDF
        run: |
          URL="https://www.nashville.gov/sites/default/files/2026-03/Old-Hickory-Community-Center-Activity-Schedule-Spring-2026.pdf"
          HTTP_STATUS=$(curl -s -o /tmp/test.pdf -w "%{http_code}" "$URL")
          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "SUCCESS: Download worked"
            ls -lh /tmp/test.pdf
          else
            echo "FAILED: Got HTTP $HTTP_STATUS"
          fi
